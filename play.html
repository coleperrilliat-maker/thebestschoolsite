<style>
:root {
    --brand: #ff6a00;
    --brand-hover: #e55f00;
    --bg: #12141f;
    --bg-elevated: #1a1d2e;
    --text: #f4f4f8;
    --text-muted: #9aa3b8;
    --bar-bg-solid: #1e1b37;
    --bar-text: #f4f4f8;
    --bar-muted: #9aa3b8;
    --bar-border: rgba(255, 106, 0, 0.22);
    --ui-accent: #ff6a00;
    --card-radius: 16px;
    /* Match homepage header “Random” (tubzi-shell .hdr-btn-random). */
    --accent-green: #22c55e;
    --accent-green-hover: #16a34a;
    --play-content-max: min(1180px, 100%);
}

body.light-play {
    --bg: #e8ecf7;
    --bg-elevated: #ffffff;
    --text: #1a1c2c;
    --text-muted: #5c6070;
    --bar-bg-solid: #ffffff;
    --bar-text: #1a2744;
    --bar-muted: #64748b;
    --bar-border: rgba(124, 58, 237, 0.2);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

html:has(body.is-fullscreen) {
    height: 100%;
    overflow: hidden;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    transition: background 0.2s ease, color 0.2s ease;
}

body.light-play {
    background: var(--bg);
}

body.is-fullscreen {
    background: #000;
    height: 100%;
    min-height: 0;
    overflow: hidden;
}

body.is-fullscreen .play-below,
body.is-fullscreen .play-dashboard {
    display: none !important;
}

body.is-fullscreen .play-stage-row {
    gap: 0;
}

.play-main {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.play-dashboard {
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    width: 100%;
    box-sizing: border-box;
    padding: 8px 14px;
    background: var(--bar-bg-solid);
    border: none;
    border-radius: 0;
    box-shadow: none;
    margin: 0;
}

body.light-play .play-dashboard {
    box-shadow: none;
}

/* Solid action chips (like homepage header: green Random, etc.) */
.play-dash-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px;
    line-height: 1.2;
    text-decoration: none;
    border: none;
    cursor: pointer;
    color: #fff;
    transition: filter 0.15s ease, transform 0.1s ease;
    box-sizing: border-box;
    box-shadow: none;
}

.play-dash-btn:hover {
    filter: brightness(1.07);
}

.play-dash-btn:active {
    transform: scale(0.98);
}

.play-dash-btn:focus-visible {
    outline: none;
}

.play-dash-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
}

button.play-dash-btn {
    font: inherit;
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px;
}

.play-dash-btn--home {
    background: transparent;
    color: var(--bar-text);
    font-weight: 700;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 10px;
}

body.light-play .play-dash-btn--home {
    border-color: rgba(26, 39, 68, 0.22);
}

.play-dash-btn--home:hover {
    filter: none;
    background: rgba(255, 255, 255, 0.08);
}

body.light-play .play-dash-btn--home:hover {
    background: rgba(0, 0, 0, 0.06);
}

.play-dash-btn--home svg {
    width: 22px;
    height: 22px;
}

.play-dash-btn--all {
    background: #7c3aed;
}

.play-dash-btn--random {
    background: var(--accent-green);
}

.play-dash-btn--random:hover {
    background: var(--accent-green-hover);
    filter: none;
}

.play-dash-btn--browse {
    background: #0284c7;
}

.play-dash-btn--discord {
    background: #5865f2;
    color: #ffffff;
}

.play-dash-btn--discord:hover {
    filter: brightness(1.08);
}

.play-dash-btn--discord .discord-mark {
    fill: #ffffff;
}

.play-dash-btn--discord svg,
.play-dash-btn--tiktok svg {
    width: 19px;
    height: 19px;
}

.play-dash-btn--tiktok {
    background: #0d9488;
    color: #ffffff;
}

.play-dash-btn--tiktok:hover {
    filter: brightness(1.08);
}

.play-dash-btn--tiktok .tiktok-mark {
    fill: #ffffff;
}

.play-dash-nav {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.play-stage-wrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 8px 12px 0;
    width: 100%;
    max-width: var(--play-content-max);
    margin: 0 auto;
    box-sizing: border-box;
}

.play-stage-row {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 0;
    min-height: 0;
}

.play-game-stack {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.play-game-inner {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.game-frame-shell {
    flex: 1 1 auto;
    min-height: 0;
    border-radius: var(--card-radius) var(--card-radius) 0 0;
    overflow: hidden;
    background: #000;
    box-shadow: none;
    display: flex;
    flex-direction: column;
}

@media (min-width: 721px) {
    .game-frame-shell {
        min-height: min(60vh, 780px);
    }
}

.game-frame-shell iframe {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    border: none;
    display: block;
}

.play-action-bar {
    flex-shrink: 0;
    background: var(--bar-bg-solid);
    border: none;
    border-radius: 0 0 var(--card-radius) var(--card-radius);
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    flex-wrap: wrap;
}

body.light-play .play-action-bar {
    background: var(--bar-bg-solid);
    box-shadow: none;
}

.action-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.action-thumb {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background-color: var(--bg-elevated);
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    box-shadow: none;
}

.action-title {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--bar-text);
    line-height: 1.2;
    margin: 0;
}

.action-sub {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--bar-muted);
    margin: 2px 0 0;
}

.action-bar-right {
    display: flex;
    align-items: center;
    gap: 8px 20px;
    flex-wrap: wrap;
}

.stat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    border: none;
    border-radius: 12px;
    background: transparent;
    cursor: pointer;
    color: var(--ui-accent);
    transition: background 0.15s ease;
}

.stat-btn:hover {
    background: rgba(255, 106, 0, 0.12);
}

.stat-btn svg {
    width: 24px;
    height: 24px;
}

.stat-count {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--bar-text);
    line-height: 1;
}

.fs-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--ui-accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
}

.fs-btn:hover {
    background: rgba(255, 106, 0, 0.12);
}

.fs-btn svg {
    width: 22px;
    height: 22px;
}

.play-below {
    flex: 0 0 auto;
    flex-shrink: 0;
    padding: 10px 16px max(24px, env(safe-area-inset-bottom, 0px));
    width: 100%;
    max-width: var(--play-content-max);
    box-sizing: border-box;
    align-self: center;
    position: relative;
    z-index: 1;
}

.more-games-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    position: relative;
    isolation: isolate;
}

.more-games-title {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    margin: 0 auto 10px;
    padding: 0 12px;
    width: 100%;
    letter-spacing: 0.02em;
    box-sizing: border-box;
    text-align: center;
}

.more-games-row {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    align-content: flex-start;
    gap: 10px;
    row-gap: 12px;
    width: 100%;
    margin: 0 auto;
    padding: 0 8px 6px;
    box-sizing: border-box;
}

.more-game-card {
    position: relative;
    overflow: hidden;
    container-type: inline-size;
    flex: 0 0 104px;
    width: 104px;
    min-width: 104px;
    max-width: 104px;
    aspect-ratio: 1;
    border-radius: var(--card-radius);
    background-color: var(--bg-elevated);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    border: none;
    transition: filter 0.15s ease;
    box-shadow: none;
}

.more-game-card:hover,
.more-game-card:focus-visible {
    filter: brightness(1.08);
}

body.light-play .more-game-card:hover,
body.light-play .more-game-card:focus-visible {
    filter: brightness(1.04);
}

body.light-play .more-game-card {
    box-shadow: none;
}

.play-game-about {
    margin-top: 28px;
    padding: 18px 16px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    text-align: left;
    width: 100%;
    box-sizing: border-box;
}

body.light-play .play-game-about {
    border-top-color: rgba(26, 39, 68, 0.15);
}

.play-game-about__heading {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 2.8vw, 1.35rem);
    color: var(--text);
    margin: 0 0 16px;
    letter-spacing: 0.02em;
}

.play-game-about__row {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: clamp(16px, 3vw, 28px);
    width: 100%;
}

.play-game-about__copy {
    flex: 1;
    min-width: 0;
}

.play-game-about__text {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    color: var(--text-muted);
    margin: 0;
    max-width: none;
    white-space: pre-line;
}

.play-game-about__thumb {
    flex-shrink: 0;
    width: min(240px, 38vw);
    aspect-ratio: 1;
    border-radius: var(--card-radius);
    background-color: var(--bg-elevated);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.play-game-about__thumb--empty {
    display: none;
}

@media (max-width: 720px) {
    .play-stage-row {
        flex-direction: column;
        align-items: stretch;
    }

    .play-game-stack {
        width: 100%;
        align-items: stretch;
    }

    .play-game-inner {
        max-width: none;
    }

    .game-frame-shell {
        min-height: 45vh;
    }

    .action-bar-right {
        width: 100%;
        justify-content: flex-start;
    }

    .more-game-card {
        flex: 0 1 calc((100% - 10px) / 2);
        width: auto;
        min-width: 0;
        max-width: none;
        aspect-ratio: 1;
    }

    .play-game-about__row {
        flex-direction: column;
        align-items: stretch;
    }

    .play-game-about__thumb {
        width: 100%;
        max-width: 280px;
        margin: 16px auto 0;
    }
}
</style>
</head>

                                <span class="stat-count" id="dislikeCount">0</span>

                            <button type="button" class="fs-btn" id="btnFullscreen" title="Fullscreen" aria-label="Fullscreen">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="play-below" id="moreGamesSection" aria-label="More games">
        <h2 class="more-games-title">More games</h2>
        <div class="more-games-grid">
            <div class="more-games-row" id="moreGamesRow1"></div>
            <div class="more-games-row" id="moreGamesRow2"></div>
            <div class="more-games-row" id="moreGamesRow3"></div>
        </div>
        <section class="play-game-about" aria-labelledby="playGameAboutHeading">
            <h2 class="play-game-about__heading" id="playGameAboutHeading"></h2>
            <div class="play-game-about__row">
                <div class="play-game-about__copy">
                    <p class="play-game-about__text" id="playGameAboutText"></p>
                </div>
                <div class="play-game-about__thumb play-game-about__thumb--empty" id="playGameAboutThumb" role="img" aria-hidden="true"></div>
            </div>
        </section>
    </section>
</div>

<script src="js/tubzi-game-entries.js"></script>
<script src="js/tubzi-game-about-detail.js"></script>
<script src="js/tubzi-layout-store.js"></script>
<script src="js/tubzi-hover-preview.js"></script>
<script>
const VOTE_KEY = "tubzi-game-votes";
const THEME_KEY = "tubzi-theme";

/* Slug must match real filenames in /games (see yohoio, OvOgame). */
const GAME_FILE_SLUG = {
    yohio: "yohoio",
    "0v0game": "OvOgame"
};

function fileSlugFromGameName(name) {
    const base = name.replace(/ /g, "").toLowerCase();
    return GAME_FILE_SLUG[base] || base;
}

/** PNGs in /images use the simple name slug, not the mismatched .html filenames. */
function imageSlugFromGameName(name) {
    return name.replace(/ /g, "").toLowerCase();
}

function imageLayersFromSlug(slug) {
    const safe = String(slug || "").replace(/"/g, "");
    return [
        `url("images/${safe}.jpg")`,
        `url("images/${safe}.jpeg")`,
        `url("images/${safe}.png")`,
        `url("images/${safe}.webp")`
    ].join(", ");
}

/** Map actual game HTML stem → image stem (for action bar thumb when ?game= uses .html name). */
const GAME_HTML_STEM_TO_IMAGE_STEM = {
    yohoio: "yohio",
    ovogame: "0v0game"
};

/* Same popularity order as index when a layout is published (tubzi-layout-store). */
let PLAY_GAME_NAMES = [
    "minecraft", "steal a brainrot", "among us", "subway surfers", "geometry dash", "spacewaves", "brawl simulator 3d", "rocket league", "moto x3m", "ultrakill",
    "1v1 lol", "shell shockers", "slope", "retro bowl", "bitlife", "drivemad", "crossyroad", "drift boss", "basketball stars", "8 ball classic",
    "aquapark io", "tiny fishing", "monkey mart", "elastic man", "snow rider 3d", "basketball random", "stick man hook", "soccerrandom", "volleyrandom",
    "get away shoot out", "funny shooter", "time shooter", "house of hazards", "rag doll archers", "level devil", "jetpackjoyride", "block blast",
    "attack hole", "bowmasters", "bank robbery", "escape road", "escape road 2", "crazy cars", "2048", "adventurecapitalist", "ahoysurvival",
    "asmallworldcup", "backrooms", "baldisbasics", "basketballbros", "basketrandom", "boxingrandom", "btd 1", "btd 2", "btd 3", "btd 4", "btd 5",
    "crazycattle 3 d", "ducklife 1", "dumbwaystodie", "fallguys", "fisquarium", "fivenightsatepsteins", "fnaf 1", "fnaf 2", "fnaf 3", "fnaf 4",
    "geometry dash meltdown", "geometry dash subzero", "geometry dash world", "granny", "happywheels", "helixjump", "hole io", "idlebreakout",
    "little alchemy 2", "melonsandbox", "moneyrush", "moto x3m pool party", "moto x3m spooky land", "moto x3m winter", "redball 4", "run 1", "run 2", "run 3",
    "tombofthemask", "papas donuteria", "papas freezeria", "papas hotdoggeria", "papas pastaria", "papas pizzeria", "plantsvszombies", "polytrack",
    "ragdolldrop", "slicemaster", "smashyroad", "soundbuttons", "survivor io", "terraria", "wordle", "wheelielife", "yohio", "0v0game",
    "block post", "retro bowl college", "worlds hardest game", "blocky snakes", "angry birds", "temple run 2", "half life", "super mario bros",
    "five nights at freddys",
    "drift hunters", "bad parenting", "blackjack"
];

if (typeof TUBZI_LAYOUT !== "undefined") {
    const merged = TUBZI_LAYOUT.loadMergedPopularity(PLAY_GAME_NAMES.map(n => ({ name: n })));
    if (merged) {
        PLAY_GAME_NAMES.sort((a, b) => {
            const ia = merged.index.get(TUBZI_LAYOUT.normName(a)) ?? 99_999;
            const ib = merged.index.get(TUBZI_LAYOUT.normName(b)) ?? 99_999;
            if (ia !== ib) {
                return ia - ib;
            }
            return a.localeCompare(b);
        });
    }
}

const GAMES = PLAY_GAME_NAMES.map(name => {
    const slug = fileSlugFromGameName(name);
    return {
        name,
        file: `games/${slug}.html`,
        imageSlug: imageSlugFromGameName(name)
    };
});

function normalizePlayGamePath(raw) {
    if (!raw) {
        return raw;
    }
    const trimmed = raw.replace(/^\.\//, "").replace(/\\/g, "/");
    const key = trimmed.toLowerCase();
    const legacy = {
        "games/yohio.html": "games/yohoio.html",
        "games/0v0game.html": "games/OvOgame.html"
    };
    return legacy[key] || trimmed;
}

const params = new URLSearchParams(window.location.search);
const gameFile = normalizePlayGamePath(params.get("game") || "");
const rawName = params.get("name") || "Game";
const gameName = (() => {
    try {
        return decodeURIComponent(rawName);
    } catch {
        return rawName;
    }
})();

const iframe = document.getElementById("gameFrame");
iframe.src = gameFile;

document.getElementById("actionTitle").textContent = gameName;

let thumbPath = "";
const htmlStem = gameFile.replace(/^games\//i, "").replace(/\.html$/i, "").trim();
if (htmlStem) {
    const key = htmlStem.toLowerCase();
    const imageStem = GAME_HTML_STEM_TO_IMAGE_STEM[key] || key;
    thumbPath = `images/${imageStem}.png`;
}
if (thumbPath) {
    const thumbSlug = thumbPath.replace(/^images\//i, "").replace(/\.[^.]+$/, "");
    const layers = imageLayersFromSlug(thumbSlug);
    document.getElementById("actionThumb").style.backgroundImage = layers;
    const aboutThumb = document.getElementById("playGameAboutThumb");
    if (aboutThumb) {
        aboutThumb.style.backgroundImage = layers;
        aboutThumb.classList.remove("play-game-about__thumb--empty");
        aboutThumb.setAttribute("aria-label", `Cover art for ${gameName}`);
        aboutThumb.removeAttribute("aria-hidden");
    }
}

function gamePathKey(path) {
    return normalizePlayGamePath(path || "").replace(/^\.\//, "").toLowerCase();
}

function goRandomGame() {
    const others = GAMES.filter(g => gamePathKey(g.file) !== currentFileNorm);
    const pool = others.length ? others : GAMES;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    window.location.href = `play.html?game=${encodeURIComponent(pick.file)}&name=${encodeURIComponent(pick.name)}`;
}

const dashRandom = document.getElementById("dashRandom");
if (dashRandom) {
    dashRandom.addEventListener("click", goRandomGame);
}

function voteKey() {
    return gameFile || "unknown";
}

function readVotes() {
    try {
        return JSON.parse(localStorage.getItem(VOTE_KEY) || "{}");
    } catch {
        return {};
    }
}

function writeVotes(obj) {
    localStorage.setItem(VOTE_KEY, JSON.stringify(obj));
}

function getStats() {
    const all = readVotes();
    const k = voteKey();
    return all[k] || { likes: 0, dislikes: 0 };
}

function setStats(s) {
    const all = readVotes();
    all[voteKey()] = s;
    writeVotes(all);
}

function formatCount(n) {
    if (n >= 1e6) {
        return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    }
    if (n >= 1e3) {
        return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
    }
    return String(n);
}

function refreshCounts() {
    const likeEl = document.getElementById("likeCount");
    const dislikeEl = document.getElementById("dislikeCount");
    if (!likeEl || !dislikeEl) {
        return;
    }
    const s = getStats();
    likeEl.textContent = formatCount(s.likes);
    dislikeEl.textContent = formatCount(s.dislikes);
}

const btnLike = document.getElementById("btnLike");
const btnDislike = document.getElementById("btnDislike");
if (btnLike) {
    btnLike.addEventListener("click", () => {
        const s = getStats();
        s.likes += 1;
        setStats(s);
        refreshCounts();
    });
}
if (btnDislike) {
    btnDislike.addEventListener("click", () => {
        const s = getStats();
        s.dislikes += 1;
        setStats(s);
        refreshCounts();
    });
}

refreshCounts();

function toggleFullscreen() {
    const fs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if (fs) {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
        return;
    }
    const el = document.getElementById("gameFrame");
    if (el.requestFullscreen) {
        el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
    }
}

document.getElementById("btnFullscreen").addEventListener("click", toggleFullscreen);

function syncFullscreenClass() {
    const fs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    document.body.classList.toggle("is-fullscreen", !!fs);
}

document.addEventListener("fullscreenchange", syncFullscreenClass);
document.addEventListener("webkitfullscreenchange", syncFullscreenClass);
document.addEventListener("MSFullscreenChange", syncFullscreenClass);

const currentFileNorm = gamePathKey(gameFile);

function playNormKey(name) {
    return String(name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "");
}

function formatGameTitle(name) {
    return String(name || "")
        .split(/(\s+)/)
        .map(part => (/\s+/.test(part) ? part : part.charAt(0).toUpperCase() + part.slice(1).toLowerCase()))
        .join("");
}

function smallHash(str) {
    let h = 0;
    const s = String(str || "");
    for (let i = 0; i < s.length; i++) {
        h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
    }
    return Math.abs(h);
}

const GENRE_LONG_FALLBACK = {
    action:
        "Expect responsive movement, short time-to-engagement, and rounds that reward reading enemy tells rather than grinding stats. Most browser action titles on TubZi emphasize readable hitboxes and restart-friendly checkpoints so you can improve quickly between attempts.",
    io: "Expect drop-in style pacing where leaderboards, map control, or elimination chains matter more than long tutorials. These games shine when you learn spawn timings, safe rotations, and when to reset after a bad fight.",
    driving:
        "Expect arcade physics—big air, forgiving resets, and tracks that reward clean racing lines more than simulation tuning. Mastery usually comes from memorizing corner entries, boost placement, and how each vehicle’s weight transfers on landings.",
    puzzle:
        "Expect rules you can explain in one sentence but depth that unfolds across dozens of stages. Good puzzle design here means fair failure: when you miss, you understand why and adjust the next attempt without guesswork.",
    sports:
        "Expect simplified controls that still respect timing—release points on shots, contest windows on defense, and momentum swings that keep matches dramatic. Sessions are built to finish before the bell rings in real life.",
    casual:
        "Expect low-friction loops you can pause anytime: incremental upgrades, cozy management, or toy-like interactions that do not demand twitch reflexes. These titles are ideal when you want progress without pressure.",
    horror:
        "Expect sound design and lighting to carry tension as much as jump scares. Stealth, resource limits, and restricted vision are common—headphones help, and playing in a well-lit room is smart if you are sensitive to frights.",
    platformer:
        "Expect jump arcs, enemy patterns, and level geometry that teach you one new trick per world. Checkpoints and generous retries keep the focus on mastery rather than punishment."
};

function longAboutFallback(displayTitle, genreRaw) {
    const g = String(genreRaw || "casual").toLowerCase();
    const genreLabel = g.charAt(0).toUpperCase() + g.slice(1);
    const body = GENRE_LONG_FALLBACK[g] || GENRE_LONG_FALLBACK.casual;
    const pick = (arr, salt) => arr[smallHash(`${displayTitle}|${salt}`) % arr.length];
    const hooks = [
        `On TubZi, ${displayTitle} is grouped as a ${genreLabel.toLowerCase()} experience: ${pick(
            [
                "it is meant to be easy to start in one click and deep enough to revisit later the same day.",
                "the focus is on readable feedback—so you always know what to try differently after a loss.",
                "sessions are sized for school breaks: enough meat for twenty minutes, not a fifty-gig install."
            ],
            "hook"
        )}`,
        body,
        `${displayTitle} runs entirely in your browser in the TubZi player. If audio or controls feel wrong, try a refresh; if the frame stutters, closing other heavy tabs usually helps. Use the home grid or the More games rows under the player when you want to hop to something else without hunting URLs.`
    ];
    return hooks.join("\n\n");
}

function resolveAboutText(displayTitle, key, genre) {
    if (typeof TUBZI_GAME_ABOUT_DETAIL !== "undefined" && TUBZI_GAME_ABOUT_DETAIL[key]) {
        return TUBZI_GAME_ABOUT_DETAIL[key];
    }
    return longAboutFallback(displayTitle, genre);
}

const GENRE_LOOKUP = new Map();
const ABOUT_BY_KEY = new Map();
if (typeof TUBZI_GAME_ENTRIES !== "undefined") {
    TUBZI_GAME_ENTRIES.forEach(([n, genre]) => {
        const k = playNormKey(n);
        const g = String(genre || "casual").toLowerCase();
        GENRE_LOOKUP.set(k, g);
        ABOUT_BY_KEY.set(k, resolveAboutText(formatGameTitle(n), k, g));
    });
}

PLAY_GAME_NAMES.forEach(name => {
    const k = playNormKey(name);
    if (!GENRE_LOOKUP.has(k)) {
        GENRE_LOOKUP.set(k, "casual");
    }
    if (!ABOUT_BY_KEY.has(k)) {
        ABOUT_BY_KEY.set(k, resolveAboutText(formatGameTitle(name), k, GENRE_LOOKUP.get(k)));
    }
});

function fillPlayingAbout() {
    const h = document.getElementById("playGameAboutHeading");
    const p = document.getElementById("playGameAboutText");
    if (!h || !p) {
        return;
    }
    const k = playNormKey(gameName);
    const genre = GENRE_LOOKUP.get(k) || "casual";
    h.textContent = `About ${gameName}`;
    p.textContent = ABOUT_BY_KEY.get(k) || resolveAboutText(gameName, k, genre);
}

fillPlayingAbout();

const GAMES_PER_MORE_ROW = 8;
const MORE_GAME_ROWS = 3;
const MORE_GAMES_TOTAL = GAMES_PER_MORE_ROW * MORE_GAME_ROWS;

const moreRows = [
    document.getElementById("moreGamesRow1"),
    document.getElementById("moreGamesRow2"),
    document.getElementById("moreGamesRow3")
].filter(Boolean);

let pool = GAMES.filter(g => gamePathKey(g.file) !== currentFileNorm);
if (!pool.length) {
    pool = GAMES.slice();
}
for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
}

const picked = [];
const seenPath = new Set();
for (const g of pool) {
    if (picked.length >= MORE_GAMES_TOTAL) {
        break;
    }
    const key = gamePathKey(g.file);
    if (seenPath.has(key)) {
        continue;
    }
    seenPath.add(key);
    picked.push(g);
}
let fillRot = 0;
while (picked.length < MORE_GAMES_TOTAL && pool.length > 0) {
    picked.push(pool[fillRot % pool.length]);
    fillRot += 1;
}

function makeMoreGameCard(g) {
    const div = document.createElement("div");
    div.className = "card more-game-card";
    div.style.backgroundImage = imageLayersFromSlug(g.imageSlug);
    div.dataset.gameTitle = g.name;
    div.style.setProperty("--title-chars", String(Math.max(1, g.name.length)));
    div.setAttribute("role", "button");
    div.setAttribute("tabindex", "0");
    div.setAttribute("aria-label", `Play ${g.name}`);
    const go = () => {
        window.location.href = `play.html?game=${encodeURIComponent(g.file)}&name=${encodeURIComponent(g.name)}`;
    };
    div.addEventListener("click", go);
    div.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            go();
        }
    });
    const layoutKey = String(g.name || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
    if (typeof tubziAttachHoverGamePreview === "function") {
        tubziAttachHoverGamePreview(div, layoutKey);
    }
    return div;
}

moreRows.forEach((rowEl, rowIndex) => {
    const start = rowIndex * GAMES_PER_MORE_ROW;
    const slice = picked.slice(start, start + GAMES_PER_MORE_ROW);
    slice.forEach(g => rowEl.appendChild(makeMoreGameCard(g)));
});

if (localStorage.getItem(THEME_KEY) === "light") {
    document.body.classList.add("light-play");
}
</script>
