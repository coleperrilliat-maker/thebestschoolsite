<meta charset="UTF-8">

<meta name="description" content="Play browser games on TubZi with full-screen controls, game guides, and quick access to more popular picks.">

<title>Play | TubZi</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 28'%3E%3Cellipse cx='17' cy='14' rx='13' ry='10' fill='%23ff6a00'/%3E%3Cpolygon points='29,14 39,8 39,20' fill='%23ff6a00'/%3E%3Ccircle cx='13' cy='13' r='2.2' fill='%23ffffff'/%3E%3C/svg%3E">

<style>
:root {
    --brand: #ff6a00;
    --brand-hover: #e55f00;
    /* Slightly lighter than #1a1a2e while keeping the same “midnight navy” vibe. */
    --bg: #222238;
    --bg-elevated: #2b2b44;
    --text: #f4f4f8;
    --text-muted: #9aa3b8;
    --bar-bg-solid: #1c1c32;
    --bar-text: #f4f4f8;
    --bar-muted: #9aa3b8;
    --bar-border: rgba(255, 106, 0, 0.22);
    --card-radius: 16px;
    --ui-accent: #ff6a00;
    --play-btn-solid: #35394d;
    --play-btn-solid-hover: #43485f;
    --play-btn-fg: #f4f4f8;
    /* Full-width stage; “more games” / about can still cap readability if needed. */
    --play-content-max: 100%;
    /* Same fluid rule as --tubzi-gutter-x (defined in home-browse.css). */
    --play-gutter-x: var(--tubzi-gutter-x);
    /* Edge rail + gutter between grey panels and the game (sandwich layout). */
    --play-ad-edge: clamp(6px, 1vw, 14px);
    --play-ad-game-gap: clamp(10px, 1.4vw, 22px);
}

body.light-play {
    --bg: #e8ecf7;
    --bg-elevated: #ffffff;
    --text: #1a1c2c;
    --text-muted: #5c6070;
    --bar-bg-solid: #ffffff;
    --bar-text: #1a2744;
    --bar-muted: #64748b;
    --bar-border: rgba(124, 58, 237, 0.2);
    --play-btn-solid: #35394d;
    --play-btn-solid-hover: #43485f;
    --play-btn-fg: #f4f4f8;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

html:has(body.is-fullscreen) {
    height: 100%;
    overflow: hidden;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    transition: background 0.2s ease, color 0.2s ease;
}

body.light-play {
    background: var(--bg);
}

body.tubchat-dock-open .play-main {
    margin-left: clamp(320px, 26vw, 430px);
}

body.tubchat-dock-open .play-dashboard,
body.tubchat-dock-open .play-stage-wrap,
body.tubchat-dock-open .play-below {
    width: calc(100% - clamp(320px, 26vw, 430px));
}

body.is-fullscreen {
    background: var(--bg);
    height: 100%;
    min-height: 0;
    overflow: hidden;
}

body.is-fullscreen .play-below,
body.is-fullscreen .play-dashboard {
    display: none !important;
}

body.is-fullscreen .play-stage-row {
    gap: 0;
}

body.is-fullscreen .play-side-ad {
    display: none !important;
}

.play-main {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    transition: margin-left 0.22s ease;
}

.play-tubchat-dock {
    position: fixed;
    top: 0;
    left: 0;
    width: clamp(320px, 26vw, 430px);
    height: 100dvh;
    z-index: 520;
    background: var(--bar-bg-solid);
    border-right: 1px solid var(--bar-border);
    box-shadow: none;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    display: flex;
    flex-direction: column;
}

body.tubchat-dock-open .play-tubchat-dock {
    transform: translateX(0);
}

.play-tubchat-dock__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 52px;
    padding: 5px 12px;
    box-sizing: border-box;
    border-bottom: 1px solid var(--bar-border);
}

.play-tubchat-dock__title {
    font-family: "Fredoka", system-ui, sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--bar-text);
}

.play-tubchat-dock__close {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    border: 2px solid rgba(255, 255, 255, 0.16);
    background: var(--play-btn-solid);
    color: var(--play-btn-fg);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
}

.play-tubchat-dock__frame-wrap {
    flex: 1 1 auto;
    min-height: 0;
}

.play-tubchat-dock__frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
}

.play-dashboard {
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    width: 100%;
    box-sizing: border-box;
    padding: 5px var(--play-gutter-x);
    background: var(--bar-bg-solid);
    border: none;
    border-radius: 0;
    box-shadow: none;
    margin: 0;
}

body.light-play .play-dashboard {
    box-shadow: none;
}

/* Solid action chips (like homepage header: green Random, etc.) */
.play-dash-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    border-radius: 8px;
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px;
    line-height: 1.2;
    text-decoration: none;
    border: none;
    cursor: pointer;
    color: var(--play-btn-fg);
    transition: filter 0.15s ease, transform 0.1s ease, background 0.15s ease;
    box-sizing: border-box;
    box-shadow: none;
}

.play-dash-btn:hover {
    filter: brightness(1.07);
}

.play-dash-btn:active {
    transform: scale(0.98);
}

.play-dash-btn:focus-visible {
    outline: none;
}

.play-dash-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
}

button.play-dash-btn {
    font: inherit;
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px;
}

.play-dash-btn--home {
    background: var(--play-btn-solid);
    color: var(--play-btn-fg);
    font-weight: 700;
    padding: 5px 10px;
    border: none;
    border-radius: 8px;
}

.play-dash-btn--home:hover {
    filter: none;
    background: var(--play-btn-solid-hover);
}

.play-dash-btn--home svg {
    width: 22px;
    height: 22px;
}

.play-dash-btn--all,
.play-dash-btn--random,
.play-dash-btn--browse,
.play-dash-btn--discord,
.play-dash-btn--tiktok {
    background: var(--play-btn-solid);
    color: var(--play-btn-fg);
}

.play-dash-btn--all:hover,
.play-dash-btn--random:hover,
.play-dash-btn--browse:hover,
.play-dash-btn--discord:hover,
.play-dash-btn--tiktok:hover {
    filter: none;
    background: var(--play-btn-solid-hover);
}

.play-dash-btn--discord .discord-mark {
    fill: currentColor;
}

.play-dash-btn--discord svg,
.play-dash-btn--tiktok svg {
    width: 19px;
    height: 19px;
}

.play-dash-btn--tiktok .tiktok-mark {
    fill: currentColor;
}

.play-dash-nav {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
}

.play-stage-wrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 5px var(--play-ad-edge) 0;
    width: 100%;
    max-width: none;
    margin: 0;
    box-sizing: border-box;
}

.play-stage-row {
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: var(--play-ad-game-gap);
    width: 100%;
    min-width: 0;
    min-height: 0;
}

.play-stage-row.play-stage-row--hide-ads .play-side-ad {
    display: none;
}

.play-side-ad {
    flex: 0 0 150px;
    width: 150px;
    min-width: 150px;
    align-self: stretch;
    min-height: 0;
    height: min(600px, 100%);
    max-height: 100%;
    border-radius: 10px;
    background: #202836;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
}

.play-game-stack {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
}

.play-game-inner {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.game-frame-shell {
    flex: 1 1 auto;
    min-height: 0;
    border-radius: var(--card-radius) var(--card-radius) 0 0;
    overflow: hidden;
    background: var(--bg);
    box-shadow: none;
    display: flex;
    flex-direction: column;
}

@media (min-width: 721px) {
    .game-frame-shell {
        min-height: min(60vh, 780px);
    }
}

.game-frame-shell iframe {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    border: none;
    display: block;
}

/* 247 Blackjack embed: hide default focus ring (often reads as orange) at the frame edge. */
#gameFrame.game-frame--flat-chrome:focus,
#gameFrame.game-frame--flat-chrome:focus-visible {
    outline: none;
    box-shadow: none;
}

.play-action-bar {
    flex-shrink: 0;
    background: var(--bar-bg-solid);
    border: none;
    border-radius: 0 0 var(--card-radius) var(--card-radius);
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    flex-wrap: wrap;
}

body.light-play .play-action-bar {
    background: var(--bar-bg-solid);
    box-shadow: none;
}

.action-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.action-thumb {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background-color: var(--bg-elevated);
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    box-shadow: none;
}

.action-title {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--bar-text);
    line-height: 1.2;
    margin: 0;
}

.action-sub {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--bar-muted);
    margin: 2px 0 0;
}

.action-bar-right {
    display: flex;
    align-items: center;
    gap: 8px 20px;
    flex-wrap: wrap;
}

.stat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    border: none;
    border-radius: 12px;
    background: var(--play-btn-solid);
    cursor: pointer;
    color: var(--play-btn-fg);
    transition: background 0.15s ease;
}

.stat-btn:hover {
    background: var(--play-btn-solid-hover);
}

.stat-btn svg {
    width: 24px;
    height: 24px;
}

.stat-count {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: inherit;
    opacity: 0.92;
    line-height: 1;
}

.fs-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: var(--play-btn-solid);
    color: var(--play-btn-fg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
}

.fs-btn:hover {
    background: var(--play-btn-solid-hover);
}

.stat-btn#btnLike,
.stat-btn#btnDislike,
.fs-btn {
    background: transparent;
    color: var(--ui-accent);
}

.stat-btn#btnLike:hover,
.stat-btn#btnDislike:hover,
.fs-btn:hover {
    background: rgba(255, 106, 0, 0.14);
}

.stat-btn#btnLike svg,
.stat-btn#btnLike svg path,
.stat-btn#btnDislike svg,
.stat-btn#btnDislike svg path {
    transition: fill 0.15s ease, stroke 0.15s ease, color 0.15s ease;
}

.stat-btn#btnLike.is-liked {
    color: #ff6a00 !important;
}

.stat-btn#btnDislike[data-on="1"] {
    color: #ff6a00 !important;
}

.stat-btn#btnLike .stat-count,
.stat-btn#btnDislike .stat-count {
    color: var(--bar-text);
}

body.light-play .stat-btn#btnLike .stat-count,
body.light-play .stat-btn#btnDislike .stat-count {
    color: var(--bar-text);
}

.fs-btn svg {
    width: 22px;
    height: 22px;
}

.play-below {
    flex: 0 0 auto;
    flex-shrink: 0;
    padding: 6px var(--play-ad-edge) max(18px, env(safe-area-inset-bottom, 0px));
    width: 100%;
    max-width: none;
    box-sizing: border-box;
    align-self: stretch;
    position: relative;
    z-index: 1;
}

.more-games-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    position: relative;
    isolation: isolate;
}

.more-games-title {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    margin: 0 auto 6px;
    padding: 0 8px;
    width: 100%;
    letter-spacing: 0.02em;
    box-sizing: border-box;
    text-align: center;
}

.more-games-row {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    justify-content: flex-start;
    align-items: flex-start;
    gap: 5px;
    width: 100%;
    margin: 0 auto;
    padding: 0 10px 6px;
    box-sizing: border-box;
    overflow: hidden;
}

.more-game-card {
    position: relative;
    overflow: hidden;
    container-type: inline-size;
    flex: 1 1 0;
    width: auto;
    min-width: 0;
    max-width: none;
    aspect-ratio: 1;
    border-radius: var(--card-radius);
    background-color: var(--bg-elevated);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    border: none;
    transition: filter 0.15s ease;
    box-shadow: none;
}

.more-game-card:hover,
.more-game-card:focus-visible {
    filter: brightness(1.08);
}

body.light-play .more-game-card:hover,
body.light-play .more-game-card:focus-visible {
    filter: brightness(1.04);
}

body.light-play .more-game-card {
    box-shadow: none;
}

.play-game-about {
    margin-top: 18px;
    padding: 12px var(--play-gutter-x) 0;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    text-align: left;
    width: 100%;
    box-sizing: border-box;
}

body.light-play .play-game-about {
    border-top-color: rgba(26, 39, 68, 0.15);
}

.play-game-about__heading {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 2.8vw, 1.35rem);
    color: var(--text);
    margin: 0 0 16px;
    letter-spacing: 0.02em;
}

.play-game-about__row {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: clamp(16px, 3vw, 28px);
    width: 100%;
}

.play-game-about__copy {
    flex: 1;
    min-width: 0;
}

.play-game-about__text {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    color: var(--text-muted);
    margin: 0;
    max-width: none;
    white-space: pre-line;
}

.play-game-about__grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.play-game-about__card {
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 12px 12px 10px;
    background: rgba(0, 0, 0, 0.1);
}

body.light-play .play-game-about__card {
    border-color: rgba(26, 39, 68, 0.18);
    background: rgba(255, 255, 255, 0.78);
}

.play-game-about__card h3 {
    margin: 0 0 6px;
    font-family: "Fredoka", system-ui, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
    color: var(--text);
}

.play-game-about__list {
    margin: 0;
    padding-left: 18px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
}

.play-game-about__list li + li {
    margin-top: 4px;
}

.play-game-about__issue {
    margin-top: 18px;
    padding-top: 4px;
}

.play-game-about__thumb {
    flex-shrink: 0;
    width: min(240px, 38vw);
    aspect-ratio: 1;
    border-radius: var(--card-radius);
    background-color: var(--bg-elevated);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.play-game-about__thumb--empty {
    display: none;
}

.play-game-about__media {
    flex-shrink: 0;
    width: min(240px, 38vw);
}

.play-game-about__keys-tip {
    margin-top: 10px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(0, 0, 0, 0.2);
}

body.light-play .play-game-about__keys-tip {
    border-color: rgba(26, 39, 68, 0.18);
    background: rgba(26, 39, 68, 0.04);
}

.play-game-about__keys-tip img {
    display: block;
    width: 100%;
    height: auto;
}

@media (max-width: 720px) {
    body.tubchat-dock-open .play-main {
        margin-left: 0;
    }

    body.tubchat-dock-open .play-dashboard,
    body.tubchat-dock-open .play-stage-wrap,
    body.tubchat-dock-open .play-below {
        width: 100%;
    }

    .play-tubchat-dock {
        width: min(94vw, 430px);
    }

    .play-game-stack {
        width: 100%;
        align-items: stretch;
    }

    .play-game-inner {
        max-width: none;
    }

    .game-frame-shell {
        min-height: 45vh;
    }

    .action-bar-right {
        width: 100%;
        justify-content: flex-start;
    }

    .more-game-card {
        flex: 1 1 0;
        width: auto;
        min-width: 0;
        max-width: none;
        aspect-ratio: 1;
    }

    .play-game-about__row {
        flex-direction: column;
        align-items: stretch;
    }

    .play-game-about__grid {
        grid-template-columns: 1fr;
    }

    .play-game-about__media {
        width: 100%;
        max-width: 280px;
        margin: 16px auto 0;
    }

    .play-game-about__thumb {
        width: 100%;
    }
}

</style>
</head>
<body>

<aside class="play-tubchat-dock" id="playTubchatDock" aria-label="Tubchat panel">
    <div class="play-tubchat-dock__bar">
        <span class="play-tubchat-dock__title">Tubchat</span>
        <button type="button" class="play-tubchat-dock__close" id="playTubchatDockClose" aria-label="Close Tubchat">×</button>
    </div>
    <div class="play-tubchat-dock__frame-wrap">
        <iframe
            class="play-tubchat-dock__frame"
            id="playTubchatDockFrame"
            title="Tubchat"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="clipboard-read; clipboard-write"
        ></iframe>
    </div>
</aside>

<div class="play-main">
    <header class="play-dashboard" aria-label="Play page navigation">
        <a class="play-dash-btn play-dash-btn--home" href="index.html" aria-label="Go back">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M11 5l-7 7 7 7"/>
            </svg>
            Go back
        </a>
        <nav class="play-dash-nav" aria-label="Quick links">

const playTubchatToggle = document.getElementById("playTubchatToggle");
const TUBCHAT_DOCK_STATE_KEY = "tubzi_tubchat_dock_open";
const TUBCHAT_EMBED_URL = "tubchat/index.html";

function isPlayTubchatDockOpen() {
    return document.body.classList.contains("tubchat-dock-open");
}

function getPlayThemeMode() {
    return document.body.classList.contains("light-play") ? "light" : "dark";
}


function getTubchatInitialPath() {
    try {
        const hasRoom = !!localStorage.getItem("tubzi_roomId");
        const hasCode = !!localStorage.getItem("tubzi_roomCode");
        const hasUser = !!localStorage.getItem("tubzi_username");
        if (hasRoom && hasCode && hasUser) {
            return "tubchat/room.html";
        }
    } catch (err) {
        /* ignore storage failures */
    }
    return TUBCHAT_EMBED_URL;
}


function syncPlayTubchatThemeToChild() {
    if (!playTubchatDockFrame || !playTubchatDockFrame.contentWindow) {
        return;
    }
    const mode = getPlayThemeMode();
    try {
        playTubchatDockFrame.contentWindow.postMessage({ type: "tubzi-theme", mode }, "*");
    } catch (err) {
        /* ignore postMessage failures */
    }
}

function setPlayTubchatDockOpen(open) {
    if (open && playTubchatDockFrame && !playTubchatDockFrame.src) {
        const mode = getPlayThemeMode();
        playTubchatDockFrame.src = `${getTubchatInitialPath()}?tubzi_theme=${encodeURIComponent(mode)}`;
    }
    document.body.classList.toggle("tubchat-dock-open", !!open);
    if (playTubchatToggle) {
        playTubchatToggle.setAttribute("aria-pressed", open ? "true" : "false");
    }
    try {
        localStorage.setItem(TUBCHAT_DOCK_STATE_KEY, open ? "1" : "0");
    } catch (err) {
        /* ignore storage failures */
    }
    syncPlayTubchatThemeToChild();
}

function togglePlayTubchatDock() {
    setPlayTubchatDockOpen(!isPlayTubchatDockOpen());
}

if (playTubchatDockFrame) {
    playTubchatDockFrame.addEventListener("load", () => {
        syncPlayTubchatThemeToChild();
    });
}


/* Slug must match real filenames in /games (see yohoio, OvOgame). */
const GAME_FILE_SLUG = {

    "0v0game": "OvOgame",
    fruitninja: "clfruitninja",
    elytraflight: "clelytraflight",
    eggycar: "cleggycar",
    smashkarts: "smash-karts",

    dunkshot: "dunk-shot",
    extremerun3d: "extreme-run-3d",
    goingballs: "going-balls",
    deathrun3d: "deathrun"
};

function fileSlugFromGameName(name) {
    const base = name.replace(/ /g, "").toLowerCase();
    return GAME_FILE_SLUG[base] || base;
}

/** PNGs in /images use the simple name slug, not the mismatched .html filenames. */
const GAME_IMAGE_SLUG = {
    "racesurvival:arenaking": "carparking",
    adventuredrivers: "adventure-drivers",
    bouncybasketball: "bouncy-basketball",
    clashofvikings: "clash-of-vikings",
    crazymotorcycle: "crazy-motorcycle",
    crazyplanelanding: "crazy-plane-landing",
    dogeminer: "doge-miner",
    dogeminer2: "doge-miner-2",
    dunkshot: "dunk-shot",
    extremerun3d: "extreme-run-3d",
    goingballs: "going-balls",
    deathrun3d: "deathrun"
};

function imageSlugFromGameName(name) {
    const base = name.replace(/ /g, "").toLowerCase();
    return GAME_IMAGE_SLUG[base] || base;
}

function imageLayersFromSlug(slug) {
    const safe = String(slug || "").replace(/"/g, "");
    return [
        `url("images/${safe}.jpg")`,
        `url("images/${safe}.jpeg")`,
        `url("images/${safe}.png")`,
        `url("images/${safe}.webp")`
    ].join(", ");
}

/** Map actual game HTML stem → image stem (for action bar thumb when ?game= uses .html name). */
const GAME_HTML_STEM_TO_IMAGE_STEM = {
    yohoio: "yohio",
    ovogame: "0v0game",
    clfruitninja: "fruitninja",
    clelytraflight: "elytraflight",
    cleggycar: "eggycar",
    "smash-karts": "smashkarts",
    "doodle-jump": "doodlejump",
    "vex-x3m": "vexx3m",
    "real-flight-simulator": "realflightsimulator",
    "tall-man-run": "tallmanrun"
};

/* Same popularity order as index when a layout is published (tubzi-layout-store). */
let PLAY_GAME_NAMES = [
    "minecraft", "among us", "subway surfers", "geometry dash", "spacewaves", "brawl simulator 3d", "steal a brainrot", "rocket league", "moto x3m", "ultrakill",
    "1v1 lol", "shell shockers", "slope", "retro bowl", "bitlife", "drivemad", "crossyroad", "drift boss", "basketball stars", "8 ball classic",
    "aquapark io", "tiny fishing", "monkey mart", "elastic man", "snow rider 3d", "basketball random", "stick man hook", "soccerrandom", "volleyrandom",
    "get away shoot out", "funny shooter", "time shooter", "house of hazards", "rag doll archers", "level devil", "jetpackjoyride", "block blast",
    "attack hole", "bowmasters", "bank robbery", "bank robbery 2", "bank robbery 3", "bacon may die", "bob the robber 2", "basket battle", "Race Survival: Arena King", "gobble", "tung tung obby", "vex", "escape road 2", "Death Run 3D", "Driven Wild", "Dune Dash", "Find the Alien", "Fort Zone", "Snowball io", "crazy cars", "2048", "adventurecapitalist", "ahoysurvival",
    "asmallworldcup", "backrooms", "baldisbasics", "basketballbros", "basketrandom", "boxingrandom", "btd 1", "btd 2", "btd 3", "btd 4", "btd 5",

    "Bad Monday Simulator", "Anton Blast", "FIFA 11", "Gorilla Tag", "Raft", "Getting Over It", "repo", "Super Monkey Ball", "not my neighbor", "Brotato", "i have no mouth", "Apes vs Helium", "Shift at Midnight", "Scary Shawarma", "Scary Teacher 3D", "Tung Tung Horror", "Tralale Escape Tung", "We Become What We Behold", "Web Fishing", "DTA 6", "GTA Vice City", "Zombie Road"
];

if (typeof TUBZI_LAYOUT !== "undefined") {
    const merged = TUBZI_LAYOUT.loadMergedPopularity(PLAY_GAME_NAMES.map(n => ({ name: n })));
    if (merged) {
        PLAY_GAME_NAMES.sort((a, b) => {
            const ia = merged.index.get(TUBZI_LAYOUT.normName(a)) ?? 99_999;
            const ib = merged.index.get(TUBZI_LAYOUT.normName(b)) ?? 99_999;
            if (ia !== ib) {
                return ia - ib;
            }
            return a.localeCompare(b);
        });
    }
}

const GAMES = PLAY_GAME_NAMES.map(name => {
    const slug = fileSlugFromGameName(name);
    return {
        name,
        file: `games/${slug}.html`,
        imageSlug: imageSlugFromGameName(name)
    };
});

function normalizePlayGamePath(raw) {
    if (!raw) {
        return raw;
    }
    const trimmed = raw.replace(/^\.\//, "").replace(/\\/g, "/");
    const key = trimmed.toLowerCase();
    const legacy = {
        "games/yohio.html": "games/yohoio.html",
        "games/0v0game.html": "games/OvOgame.html"
    };
    return legacy[key] || trimmed;
}

const params = new URLSearchParams(window.location.search);
const gameFile = normalizePlayGamePath(params.get("game") || "");
const rawName = params.get("name") || "Game";
const gameName = (() => {
    try {
        return decodeURIComponent(rawName);
    } catch {
        return rawName;
    }
})();

const iframe = document.getElementById("gameFrame");
iframe.src = gameFile;
if (/\/247blackjack\.html$/i.test(String(gameFile || ""))) {
    iframe.classList.add("game-frame--flat-chrome");
} else {
    iframe.classList.remove("game-frame--flat-chrome");
}

document.getElementById("actionTitle").textContent = gameName;

let thumbPath = "";
const htmlStem = gameFile.replace(/^games\//i, "").replace(/\.html$/i, "").trim();
if (htmlStem) {
    const key = htmlStem.toLowerCase();
    const imageStem = GAME_HTML_STEM_TO_IMAGE_STEM[key] || key;
    thumbPath = `images/${imageStem}.png`;
}
if (thumbPath) {
    const thumbSlug = thumbPath.replace(/^images\//i, "").replace(/\.[^.]+$/, "");
    const layers = imageLayersFromSlug(thumbSlug);
    document.getElementById("actionThumb").style.backgroundImage = layers;
    const aboutThumb = document.getElementById("playGameAboutThumb");
    if (aboutThumb) {
        aboutThumb.style.backgroundImage = layers;
        aboutThumb.classList.remove("play-game-about__thumb--empty");
        aboutThumb.setAttribute("aria-label", `Cover art for ${gameName}`);
        aboutThumb.removeAttribute("aria-hidden");
    }
}

function gamePathKey(path) {
    return normalizePlayGamePath(path || "").replace(/^\.\//, "").toLowerCase();
}

function goRandomGame() {
    const others = GAMES.filter(g => gamePathKey(g.file) !== currentFileNorm);
    const pool = others.length ? others : GAMES;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    window.location.href = `play.html?game=${encodeURIComponent(pick.file)}&name=${encodeURIComponent(pick.name)}`;
}

const dashRandom = document.getElementById("dashRandom");
if (dashRandom) {
    dashRandom.addEventListener("click", goRandomGame);
}

function toggleFullscreen() {
    const fs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if (fs) {
        if (document.exitFullscreen) {

(function keepSideAdsWhenPossible() {
    const stageRow = document.getElementById("playStageRow");
    if (!stageRow) {
        return;
    }
    const gameStack = stageRow.querySelector(".play-game-stack");
    const ads = Array.from(stageRow.querySelectorAll(".play-side-ad"));
    if (!gameStack || ads.length !== 2) {
        return;
    }

    const AD_SLOT_W = 150;
    const MIN_GAME_W = 420;
    const HYST = 48;

    function parsePx(value) {
        const n = Number.parseFloat(String(value || "").trim());
        return Number.isFinite(n) ? n : 0;
    }

    function syncAdVisibility() {
        const stageStyle = window.getComputedStyle(stageRow);
        const gap = parsePx(stageStyle.columnGap || stageStyle.gap) || 16;

        const stageWidth = stageRow.getBoundingClientRect().width || 0;
        const minStageForAds = AD_SLOT_W * 2 + gap * 2 + MIN_GAME_W;
        const showStageForAds = minStageForAds + HYST;

        const adsCurrentlyHidden = stageRow.classList.contains("play-stage-row--hide-ads");

        if (adsCurrentlyHidden && stageWidth > 0 && stageWidth < showStageForAds) {
            return;
        }

        if (stageWidth > 0 && stageWidth < minStageForAds) {
            stageRow.classList.add("play-stage-row--hide-ads");
            return;
        }

        stageRow.classList.remove("play-stage-row--hide-ads");

        const gameWidth = gameStack.getBoundingClientRect().width || 0;
        const adTotalWidth = ads.reduce((sum, ad) => sum + (ad.getBoundingClientRect().width || 0), 0);

        const adsDominateGame = gameWidth > 0 && adTotalWidth > (2 / 3) * gameWidth;
        const gameTooNarrowWithRails = gameWidth > 0 && gameWidth < MIN_GAME_W;

        const shouldHide = gameWidth <= 0 || adsDominateGame || gameTooNarrowWithRails;
        stageRow.classList.toggle("play-stage-row--hide-ads", shouldHide);
    }

    syncAdVisibility();
    window.addEventListener("resize", syncAdVisibility);
    if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(syncAdVisibility);
        ro.observe(stageRow);
        ro.observe(gameStack);
    }
})();
