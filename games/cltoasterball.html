<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@8dc0657056a87e002a099cad5854900c74be1659/toasterball/">
    <title>Toasterball</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background-color: #5525a5;
            box-sizing: border-box;
        }

        #gameContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
            vertical-align: bottom;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Build.json");
    </script>
</body>
</html>
