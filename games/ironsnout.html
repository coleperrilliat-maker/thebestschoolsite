<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Snout</title>
<base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@5374d57e9cee53129e2a4b730a63b8a6322e81de/iron%20snout/">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
}
#gameWrap{
  width:100vw;
  height:100vh;
  overflow:hidden;
  position:relative;
}
canvas{
  width:100% !important;
  height:100% !important;
  display:block;
  image-rendering:auto;
  touch-action:none;
}
:-webkit-full-screen canvas,
:fullscreen canvas{
  width:100vw !important;
  height:100vh !important;
}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="canvas" width="640" height="400">
    Your browser doesn't support HTML5 canvas.
  </canvas>
</div>
<script src="html5game/IronSnout.js?TGDYB=1698209485"></script>
<script>
function resizeGame(){
  const canvas = document.getElementById('canvas');
  if(!canvas) return;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', resizeGame);
resizeGame();
</script>
</body>
</html>
